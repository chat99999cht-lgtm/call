<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    /* Yahan admin panel ka CSS daal dein */
    body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .admin-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    input, select, textarea { width: 100%; background: #0f172a; color: #fff; padding: 8px; border: 1px solid #334155; border-radius: 6px; margin-top: 5px; margin-bottom: 10px; }
    button { background: #22c55e; color: #0f172a; font-weight: bold; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h2><i class="fas fa-user-shield"></i> Admin Control Center</h2>
  
  <!-- Admin Panel ka pura HTML yahan rahega -->
  <div class="admin-card">
    <h3>Onboard Agent</h3>
    <input type="text" id="adminAgentName" placeholder="Agent Name">
    <input type="tel" id="adminAgentMobile" maxlength="10" placeholder="Mobile Number">
    <input type="text" id="adminAgentPin" maxlength="4" placeholder="4-Digit PIN">
    <button onclick="adminSaveUser()">+ Add Agent</button>
  </div>

  <div class="admin-card">
    <h3>Active Agents & Live Activity</h3>
    <div id="adminUserList"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbg-yDrl1_FYXEDjLN9Ay0kWJ556Xvdeg",
      authDomain: "smart-call-9950a.firebaseapp.com",
      databaseURL: "https://smart-call-9950a-default-rtdb.firebaseio.com",
      projectId: "smart-call-9950a",
      storageBucket: "smart-call-9950a.firebasestorage.app",
      messagingSenderId: "965909062156",
      appId: "1:965909062156:web:60572b1b3409a7e5284429"
    };
    firebase.initializeApp(firebaseConfig);

    function getUsersDB() {
      const stored = localStorage.getItem('systemUsersDB');
      return stored ? JSON.parse(stored) : {};
    }
    function saveUsersDB(dbData) {
      localStorage.setItem('systemUsersDB', JSON.stringify(dbData));
      firebase.database().ref('systemUsersDB').set(dbData);
    }

    window.addEventListener('load', () => {
      firebase.database().ref('systemUsersDB').on('value', snapshot => {
        const cloudDb = snapshot.val();
        if (cloudDb) {
          localStorage.setItem('systemUsersDB', JSON.stringify(cloudDb));
          renderAdminUserLists();
        }
      });
      renderAdminUserLists();
    });

    function adminSaveUser() {
      const name = document.getElementById('adminAgentName').value.trim();
      const mobile = document.getElementById('adminAgentMobile').value.trim();
      const pin = document.getElementById('adminAgentPin').value.trim();
      if (!name || mobile.length !== 10 || pin.length !== 4) { alert('Sahi details bharein'); return; }
      const db = getUsersDB();
      db[pin] = { name, mobile, shift: '09:00 AM - 06:00 PM', break: 'Working', leads: [], callHistory: [] };
      saveUsersDB(db);
      alert('Agent Added Successfully!');
    }

    function renderAdminUserLists() {
      const db = getUsersDB();
      const container = document.getElementById('adminUserList');
      container.innerHTML = '';
      Object.keys(db).forEach(pin => {
        let u = db[pin];
        container.innerHTML += `<div style="background:#0f172a; padding:8px; margin-top:5px; border-radius:6px;"><b>${u.name}</b> (PIN: ${pin}) - Status: ${u.break}</div>`;
      });
    }
  </script>
</body>
</html>
