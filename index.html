<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Auto Dialer & Lead Manager with Cloud Sync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Web App Manifest for Add to Home Screen PWA -->
  <link rel="manifest" id="manifestPlaceholder">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 10px; padding-bottom: 90px; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
    
    /* Splash & Onboarding Styles */
    #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; transition: opacity 0.5s ease; }
    .splash-card { background: rgba(30, 41, 59, 0.85); border: 2px solid #22c55e; border-radius: 24px; padding: 30px 20px; width: 100%; max-width: 380px; box-shadow: 0 0 40px rgba(34, 197, 94, 0.4); display: flex; flex-direction: column; align-items: center; gap: 15px; backdrop-filter: blur(10px); }
    .splash-logo-circle { width: 70px; height: 70px; background: linear-gradient(135deg, #22c55e, #15803d); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); }

    .app-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; margin-top: 4px; user-select: text; -webkit-user-select: text; }
    .app-input:focus { border-color: #22c55e; }
    .app-btn { width: 100%; background: #22c55e; color: #0f172a; font-weight: bold; padding: 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .admin-link { margin-top: 10px; font-size: 12px; color: #38bdf8; text-decoration: underline; cursor: pointer; }

    /* Top Bar Styling */
    .top-slider { height: 75px; background: rgba(34, 197, 94, 0.12); border: 2px solid #22c55e; border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; overflow: hidden; box-shadow: 0 0 22px rgba(34, 197, 94, 0.35), inset 0 0 12px rgba(34, 197, 94, 0.2); transition: all 0.3s ease; position: relative; }
    .calling-man-icon { font-size: 28px; margin-right: 8px; flex-shrink: 0; color: #38bdf8; display: flex; align-items: center; }
    .computer-wave-flow { display: flex; align-items: center; gap: 4px; margin-right: 10px; }
    .computer-wave-flow span { display: block; width: 3px; background-color: #38bdf8; border-radius: 2px; animation: flowWave 1s infinite ease-in-out; }
    .computer-wave-flow span:nth-child(1) { animation-delay: 0.1s; height: 6px; }
    .computer-wave-flow span:nth-child(2) { animation-delay: 0.3s; height: 12px; }
    .computer-wave-flow span:nth-child(3) { animation-delay: 0.2s; height: 16px; }
    .computer-wave-flow span:nth-child(4) { animation-delay: 0.4s; height: 10px; }
    @keyframes flowWave { 0%, 100% { transform: scaleY(0.4); opacity: 0.4; } 50% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 5px #38bdf8); } }

    .slider-track { flex: 1; overflow: hidden; display: flex; align-items: center; }
    .slider-text { font-size: 15px; font-weight: bold; color: #22c55e; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

    .top-bar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 8px; }
    .shake-icon { font-size: 20px; color: #90EE38; display: inline-block; animation: shakeEffect 0.8s infinite ease-in-out; }
    @keyframes shakeEffect { 0% { transform: rotate(0deg); } 20% { transform: rotate(-15deg); } 40% { transform: rotate(15deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }

    .summary-section { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .summary-box { background: #1e293b; padding: 6px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; min-height: 85px; }
    .summary-box.int { border-top: 3px solid #22c55e; }
    .summary-box.not-int { border-top: 3px solid #ef4444; }
    .summary-box.time-box { border-top: 3px solid #eab308; }
    .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .summary-title { font-size: 10px; font-weight: bold; }
    .copy-btn { background: #334155; color: #fff; border: none; padding: 2px 5px; border-radius: 4px; font-size: 9px; cursor: pointer; }
    .summary-list { font-family: monospace; font-size: 10px; color: #cbd5e1; height: 55px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; background: #0f172a; padding: 4px; border-radius: 6px; user-select: none; }

    .inputs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .add-box { background: #1e293b; padding: 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #334155; }
    textarea { width: 100%; height: 45px; background: #0f172a; color: #fff; padding: 6px; border: 1px solid #334155; border-radius: 6px; font-family: monospace; font-size: 11px; outline: none; resize: none; user-select: text; -webkit-user-select: text; }
    
    .btn-row { display: flex; gap: 4px; width: 100%; }
    .btn-danger, .btn-primary { flex: 1; font-weight: bold; padding: 8px 2px; border: none; border-radius: 6px; cursor: pointer; font-size: 10px; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-primary { background: #38bdf8; color: #0f172a; }

    .container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .num-card-box { background: #1e293b; padding: 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #334155; }
    .action-row { display: flex; gap: 6px; }
    .num-card { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
    .num-card.called { background: #ef4444 !important; }
    .status-buttons-row { display: flex; gap: 4px; }
    .sub-btn { flex: 1; padding: 6px 2px; background: #0f172a; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }

    #toast { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #0f172a; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; z-index: 100000; display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN / ONBOARDING MODAL -->
  <div id="splashScreen">
    <div class="splash-card" id="onboardingBox">
      <div class="splash-logo-circle"><i class="fas fa-headset"></i></div>
      <div>
        <h2 style="font-size: 18px; color: #22c55e; font-weight: bold;">User Login Portal</h2>
        <p style="font-size: 11px; color: #94a3b8;">Apna Mobile Number daal kar login karein</p>
      </div>
      <div style="width: 100%; text-align: left;">
        <label style="font-size: 11px; color: #cbd5e1;">Your Name:</label>
        <input type="text" id="loginName" class="app-input" placeholder="Apna Naam Likhein">
      </div>
      <div style="width: 100%; text-align: left;">
        <label style="font-size: 11px; color: #cbd5e1;">Your Number:</label>
        <input type="tel" id="loginPhone" class="app-input" placeholder="10-Digit Mobile Number">
      </div>
      <button class="app-btn" onclick="processUserLogin()">Login to Duty</button>
      <div class="admin-link" onclick="showAdminAuthView()">Admin Access (Code Required)</div>
    </div>

    <!-- Admin View -->
    <div class="splash-card hidden" id="adminAuthBox">
      <div class="splash-logo-circle" style="background: #38bdf8;"><i class="fas fa-user-shield"></i></div>
      <h2 style="font-size: 18px; color: #38bdf8;">Admin Login</h2>
      <input type="password" id="adminCodeInput" class="app-input" placeholder="Enter 4-Digit Code">
      <button class="app-btn" style="background:#38bdf8;" onclick="verifyAdminCode()">Unlock Admin Panel</button>
      <div class="admin-link" onclick="showUserLoginView()">Back to User Login</div>
    </div>

    <!-- Admin Panel -->
    <div class="splash-card hidden" id="adminControlBox" style="max-width: 420px; max-height: 90vh; overflow-y: auto;">
      <h2 style="font-size: 18px; color: #38bdf8;">⚙️ Admin Management Panel</h2>
      <div style="width: 100%; text-align: left; margin-top: 10px;">
        <label style="font-size: 10px; color: #cbd5e1;">Target User Phone:</label>
        <input type="tel" id="admTargetUserPhone" class="app-input" placeholder="Jis user ko number dena hai">
        <label style="font-size: 10px; color: #cbd5e1; margin-top: 6px; display: block;">Paste Numbers (Comma / Newline):</label>
        <textarea id="admAssignedNumbers" class="app-input" style="height: 70px;" placeholder="9876543210, 9123456789..."></textarea>
        <button class="app-btn" style="background:#38bdf8; margin-top: 8px;" onclick="adminAssignNumbersToUser()">Assign Numbers to User</button>
      </div>
      <button class="app-btn" style="background:#ef4444; margin-top: 12px;" onclick="closeAdminAndGoLogin()">Exit Admin Panel</button>
    </div>
  </div>

  <div id="toast"><span id="toastText">Done!</span></div>

  <!-- TOP BAR -->
  <div class="top-slider">
    <div style="display: flex; align-items: center; flex: 1;">
      <div class="calling-man-icon"><i class="fas fa-desktop"></i></div>
      <div class="slider-track">
        <div class="slider-text" id="currentUserDisplay">Smart Dialer</div>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="shake-icon" onclick="showAdminAuthView()"><i class="fas fa-user-shield"></i></div>
    </div>
  </div>

  <!-- SUMMARY BOXES -->
  <div class="summary-section">
    <div class="summary-grid">
      <div class="summary-box int">
        <div class="summary-header"><span class="summary-title" style="color:#22c55e;">👍 Int (<span id="countInt">0</span>)</span></div>
        <div class="summary-list" id="listInt">None</div>
      </div>
      <div class="summary-box not-int">
        <div class="summary-header"><span class="summary-title" style="color:#ef4444;">👎 Not (<span id="countNotInt">0</span>)</span></div>
        <div class="summary-list" id="listNotInt">None</div>
      </div>
      <div class="summary-box time-box">
        <div class="summary-header"><span class="summary-title" style="color:#eab308;">⏰ Time (<span id="countTime">0</span>)</span></div>
        <div class="summary-list" id="listTime">None</div>
      </div>
    </div>
  </div>

  <!-- INPUT & BUTTONS -->
  <div class="inputs-row">
    <div class="add-box">
      <label style="font-size: 10px; color: #38bdf8; font-weight: bold;">➕ Add Local Numbers:</label>
      <textarea id="bulkInput" placeholder="Numbers paste karein..."></textarea>
      <div class="btn-row">
        <button class="btn-primary" onclick="addLocalNumbers()">Add</button>
        <button class="btn-danger" onclick="clearAllNumbers()">Clear All</button>
      </div>
    </div>
  </div>

  <!-- DYNAMIC NUMBERS CONTAINER -->
  <div id="numbersContainer" class="container"></div>

  <!-- Firebase v10 Real-Time Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbG-yDrll_fYXEDjLN9Ay0kwJ556Xvdeg",
      authDomain: "smart-call-9950a.firebaseapp.com",
      databaseURL: "https://smart-call-9950a-default-rtdb.firebaseio.com",
      projectId: "smart-call-9950a",
      storageBucket: "smart-call-9950a.firebasestorage.app",
      messagingSenderId: "965909062156",
      appId: "1:965909062156:web:60572b1b3409a7e5284429",
      measurementId: "G-B19VDHLM39"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;

    let currentUserPhone = localStorage.getItem('user_phone') || '';
    let currentUserName = localStorage.getItem('user_name') || '';

    window.processUserLogin = function() {
      const name = document.getElementById('loginName').value.trim();
      const phone = document.getElementById('loginPhone').value.trim();

      if (!phone || phone.length < 10) {
        alert('Kripya valid 10-digit mobile number enter karein!');
        return;
      }

      currentUserPhone = phone;
      currentUserName = name || 'User';

      localStorage.setItem('user_phone', currentUserPhone);
      localStorage.setItem('user_name', currentUserName);

      document.getElementById('splashScreen').style.display = 'none';
      document.getElementById('currentUserDisplay').innerText = `${currentUserName} (${currentUserPhone})`;

      // ⚡ Start Real-Time Listener for logged in User
      listenToUserUpdates(currentUserPhone);
    };

    // Auto Login Check
    if (currentUserPhone) {
      document.getElementById('splashScreen').style.display = 'none';
      document.getElementById('currentUserDisplay').innerText = `${currentUserName} (${currentUserPhone})`;
      listenToUserUpdates(currentUserPhone);
    }

    // ⚡ REAL-TIME DATABASE LISTENER (The Magic Function)
    function listenToUserUpdates(phone) {
      const userRef = ref(db, 'users/' + phone);
      onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          console.log("⚡ Live Remote Update Received:", data);
          if (data.assignedNumbers) {
            renderNumbersUI(data.assignedNumbers);
          }
          if (data.categories) {
            updateCategoryUI(data.categories);
          }
        }
      });
    }

    // UI Render Function
    function renderNumbersUI(numbersList) {
      const container = document.getElementById('numbersContainer');
      container.innerHTML = '';

      let list = Array.isArray(numbersList) ? numbersList : numbersList.split(',').map(n => n.trim());

      list.forEach((num, index) => {
        if (!num) return;
        const box = document.createElement('div');
        box.className = 'num-card-box';
        box.innerHTML = `
          <div class="action-row">
            <a href="tel:${num}" class="num-card" onclick="markCalled(this)">📞 Call ${num}</a>
          </div>
          <div class="status-buttons-row">
            <button class="sub-btn" onclick="updateStatus('${num}', 'interested')">👍 Interested</button>
            <button class="sub-btn" onclick="updateStatus('${num}', 'not_interested')">👎 Not Int</button>
            <button class="sub-btn" onclick="updateStatus('${num}', 'time')">⏰ Time</button>
          </div>
        `;
        container.appendChild(box);
      });
    }

    window.markCalled = function(element) {
      element.classList.add('called');
    };

    window.updateStatus = function(phoneNum, status) {
      if (!currentUserPhone) return;
      const statusRef = ref(db, `users/${currentUserPhone}/categories/${status}/${phoneNum}`);
      set(statusRef, new Date().toLocaleString());
      showToast(`Marked as ${status.toUpperCase()}`);
    };

    function updateCategoryUI(categories) {
      if (categories.interested) {
        document.getElementById('countInt').innerText = Object.keys(categories.interested).length;
        document.getElementById('listInt').innerText = Object.keys(categories.interested).join('\n');
      }
      if (categories.not_interested) {
        document.getElementById('countNotInt').innerText = Object.keys(categories.not_interested).length;
        document.getElementById('listNotInt').innerText = Object.keys(categories.not_interested).join('\n');
      }
      if (categories.time) {
        document.getElementById('countTime').innerText = Object.keys(categories.time).length;
        document.getElementById('listTime').innerText = Object.keys(categories.time).join('\n');
      }
    }

    // Admin Assign Numbers
    window.adminAssignNumbersToUser = function() {
      const targetPhone = document.getElementById('admTargetUserPhone').value.trim();
      const rawNumbers = document.getElementById('admAssignedNumbers').value.trim();

      if (!targetPhone || !rawNumbers) {
        alert('Target Phone aur Numbers dono bharein!');
        return;
      }

      const numbersArray = rawNumbers.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length >= 10);

      set(ref(db, `users/${targetPhone}/assignedNumbers`), numbersArray)
        .then(() => {
          alert(`Successfully assigned ${numbersArray.length} numbers to ${targetPhone}`);
          document.getElementById('admAssignedNumbers').value = '';
        })
        .catch(err => alert("Error assigning numbers: " + err.message));
    };

    // Helper functions
    window.showAdminAuthView = function() {
      document.getElementById('onboardingBox').classList.add('hidden');
      document.getElementById('adminAuthBox').classList.remove('hidden');
      document.getElementById('splashScreen').style.display = 'flex';
    };

    window.showUserLoginView = function() {
      document.getElementById('adminAuthBox').classList.add('hidden');
      document.getElementById('adminControlBox').classList.add('hidden');
      document.getElementById('onboardingBox').classList.remove('hidden');
    };

    window.verifyAdminCode = function() {
      const code = document.getElementById('adminCodeInput').value;
      if (code === "1234" || code === "9950") { // Set your preferred Admin Code
        document.getElementById('adminAuthBox').classList.add('hidden');
        document.getElementById('adminControlBox').classList.remove('hidden');
      } else {
        alert("Wrong Admin Code!");
      }
    };

    window.closeAdminAndGoLogin = function() {
      showUserLoginView();
      if (currentUserPhone) {
        document.getElementById('splashScreen').style.display = 'none';
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastText').innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }
  </script>
</body>
</html>
