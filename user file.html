<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Dialer & Lead Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    /* Yahan User app ka CSS rahega */
    body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 15px; }
    .num-card-box { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .num-card { background: #22c55e; color: #fff; padding: 8px; text-decoration: none; display: block; text-align: center; font-weight: bold; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Login Modal / PIN Box -->
  <div id="loginBox" style="background:#1e293b; padding:20px; border-radius:10px; max-width:300px; margin:50px auto; text-align:center;">
    <h3>Agent Login</h3>
    <input type="password" id="userPinInput" maxlength="4" placeholder="Enter 4-Digit PIN" style="padding:8px; font-size:18px; text-align:center; width:80%; margin:10px 0;">
    <br><button onclick="verifyUserPin()" style="background:#22c55e; padding:8px 15px; font-weight:bold; border:none; border-radius:5px;">Login</button>
  </div>

  <!-- User Dashboard (Login ke baad dikhega) -->
  <div id="userDashboard" style="display:none;">
    <h2>📞 My Leads & Dialer</h2>
    <div id="numberList"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbg-yDrl1_FYXEDjLN9Ay0kWJ556Xvdeg",
      authDomain: "smart-call-9950a.firebaseapp.com",
      databaseURL: "https://smart-call-9950a-default-rtdb.firebaseio.com",
      projectId: "smart-call-9950a",
      storageBucket: "smart-call-9950a.firebasestorage.app",
      messagingSenderId: "965909062156",
      appId: "1:965909062156:web:60572b1b3409a7e5284429"
    };
    firebase.initializeApp(firebaseConfig);

    let numbersData = [];
    let activePin = '';

    function verifyUserPin() {
      const pin = document.getElementById('userPinInput').value.trim();
      firebase.database().ref('systemUsersDB/' + pin).once('value', snapshot => {
        const user = snapshot.val();
        if (user) {
          if (user.break === 'Off Duty') {
            alert('Aap Duty Off hain! Admin se sampark karein.');
            return;
          }
          activePin = pin;
          numbersData = user.leads || [];
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('userDashboard').style.display = 'block';
          renderLeads();
        } else {
          alert('Invalid PIN!');
        }
      });
    }

    function renderLeads() {
      const container = document.getElementById('numberList');
      container.innerHTML = '';
      if (numbersData.length === 0) {
        container.innerHTML = '<p>Koi leads assign nahi hain.</p>';
        return;
      }
      numbersData.forEach((item, index) => {
        container.innerHTML += `
          <div class="num-card-box">
            <a href="tel:${item.number}" class="num-card" onclick="markCalled(${index})">📞 Call ${item.number}</a>
          </div>
        `;
      });
    }

    function markCalled(index) {
      numbersData[index].called = true;
      firebase.database().ref('systemUsersDB/' + activePin + '/leads').set(numbersData);
    }
  </script>
</body>
</html>
